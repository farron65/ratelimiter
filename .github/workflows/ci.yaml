name: Rate Limiter

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check for race condition
        run: go test -race ./...